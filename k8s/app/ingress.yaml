# k3s ke built-in Traefik ke liye. kind pe ingress controller nahi hota, wahan port-forward use karo.
# Domain lagane ke baad "host: yourdomain.com" add kar dena.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  namespace: portfolio
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
